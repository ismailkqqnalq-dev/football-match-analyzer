[pytest]
testpaths = tests
markers =
    requires_model: Eğitilmiş YOLO model ağırlık dosyası (models/football_yolo11s_best.pt) gerektirir
    requires_pitch_model: Eğitilmiş saha anahtar nokta YOLO-Pose ağırlık dosyası (models/football_pitch_pose.pt) gerektirir
    gpu: CUDA destekli NVIDIA GPU (torch.cuda.is_available()) gerektirir
